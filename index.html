<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URSA.cx</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}
body {
  background: #000;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
nav.navbar {
  position: fixed;
  top: 20px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 35px;
  padding: 18px 35px;
  backdrop-filter: blur(10px);
  z-index: 10;
  overflow: hidden;
}
nav ul {
  display: flex;
  list-style: none;
  gap: 35px;
}
nav a {
  color: #fff;
  text-decoration: none;
  font-size: 15px;
  transition: 0.2s;
}
nav a:hover { color: #8c94ff; }

/* cursor-follow white bg effect */
.nav-highlight {
  position: absolute;
  top: 0;
  left: 0;
  width: 160px;
  height: 160px;
  background: radial-gradient(circle, rgba(255,255,255,0.12), transparent 60%);
  pointer-events: none;
  transform: translate(-50%, -50%);
  opacity: 0;
  transition: opacity 0.3s;
}
nav.navbar:hover .nav-highlight {
  opacity: 1;
}

main {
  flex: 1;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  padding-top: 80px;
}

.glass {
  width: 85%;
  max-width: 1100px;
  aspect-ratio: 16 / 9;
  background: radial-gradient(circle at 25% 75%, rgba(100,110,130,0.6), transparent 40%),
              radial-gradient(circle at 75% 25%, rgba(100,110,130,0.6), transparent 40%);
  border-radius: 50px;
  border: 1px solid rgba(255,255,255,0.25);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background-position: center;
  background-size: 220% 220%;
  transition: background-position 0.15s linear;
}

h1 {
  font-size: 3.3rem;
  letter-spacing: 1px;
  font-weight: 600;
}
h1 span { color: #8c94ff; }

.purchase {
  margin-top: 25px;
  padding: 12px 35px;
  border-radius: 20px;
  background: rgba(255,255,255,0.05);
  color: white;
  border: 1px solid rgba(255,255,255,0.25);
  cursor: pointer;
  transition: 0.2s;
}
.purchase:hover { background: rgba(140,148,255,0.25); }

.icons {
  display: flex;
  gap: 25px;
  margin-top: 40px;
}
.icons img {
  width: 28px;
  filter: invert(1);
  opacity: 0.7;
  transition: 0.2s;
}
.icons img:hover {
  opacity: 1;
  transform: scale(1.1);
}
footer {
  padding: 20px 0;
}
footer a {
  color: #8c94ff;
  text-decoration: none;
  font-size: 13px;
}
footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<nav class="navbar" id="navbar">
  <div class="nav-highlight" id="navHighlight"></div>
  <ul>
    <li><a href="#">Profile</a></li>
    <li><a href="#">Products</a></li>
    <li><a href="#">About Us</a></li>
    <li><a href="#">Youtube</a></li>
    <li><a href="#">Discord</a></li>
  </ul>
</nav>

<main>
  <div class="glass" id="glass">
    <h1>URSA.<span>cx</span></h1>
    <button class="purchase">Purchase</button>
    <div class="icons">
      <a href="#"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/discord.svg" alt="Discord"></a>
      <a href="#"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/telegram.svg" alt="Telegram"></a>
      <a href="#"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/youtube.svg" alt="YouTube"></a>
    </div>
  </div>
</main>

<footer>
  <a href="#">URSA status</a>
</footer>

<script>
const glass = document.getElementById('glass');
let offsetX = 0.5, offsetY = 0.5;
let drift = 0;

// Track cursor
glass.addEventListener('mousemove', e => {
  const rect = glass.getBoundingClientRect();
  offsetX = (e.clientX - rect.left) / rect.width;
  offsetY = (e.clientY - rect.top) / rect.height;
});

// Enhanced animated movement
function animate() {
  drift += 0.005;
  const waveX = Math.sin(drift * 1.2) * 6;
  const waveY = Math.cos(drift * 1.4) * 6;
  const moveX = (offsetX - 0.5) * 12 + waveX;
  const moveY = (offsetY - 0.5) * 12 + waveY;
  glass.style.backgroundPosition = `${50 + moveX}% ${50 + moveY}%`;
  requestAnimationFrame(animate);
}
animate();

// navbar glow trail
const navbar = document.getElementById('navbar');
const highlight = document.getElementById('navHighlight');
navbar.addEventListener('mousemove', e => {
  const rect = navbar.getBoundingClientRect();
  highlight.style.left = `${e.clientX - rect.left}px`;
  highlight.style.top = `${e.clientY - rect.top}px`;
});
</script>
</body>
</html>
